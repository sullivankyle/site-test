<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome to Kyle Sullivan's cool website.</title>
  <style>
    :root { --bg: #f7f6f2; --fg: #1d1d1b; --muted: #6b6b66; --accent: #2f6f5e; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #161615; --fg: #ecebe6; --muted: #9a9a93; --accent: #6fc2a8; }
    }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { padding: 24px; max-width: 32rem; }
    h1 { font-size: 2rem; margin: 0 0 .5rem; color: var(--accent); }
    p { color: var(--muted); line-height: 1.6; margin: 0; }
  </style>
</head>
<body>
  <main>
    <h1>Welcome to Kyle Sullivan's cool website.</h1>
    <p>Placeholder page. If you can read this, the GitHub to Pages pipeline works.</p>
    <p id="version">Version 2 (pushed automatically)</p>
  </main>
</body>
</html>
